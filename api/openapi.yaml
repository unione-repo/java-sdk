        rus: "Возвращает информацию о записях, которые надо внести в DNS для испол\
          ьзования домена в UniOne."
      x-description-i18n:
        rus: "Чтобы отправлять письма, вам надо подтвердить владение доменом, с об\
          ратным адресом которого вы собираетесь их отправлять, а также настроить\
          \ DKIM-подпись для этого домена. Метод позволяет вам зарегистрировать до\
          мен в UniOne и сгенерировать запись для проверки владением и DKIM-ключ,\
          \ либо получить их, если они были сгенерированы ранее.<br>После получени\
          я успешного ответа вам надо добавить DNS-записи наподобие этих:<br>`@ IN\
          \ TXT **unione-validate-hash=483bb362ebdbeedd755cfb1d4d661**`<br>`us._domainkey\
          \ IN TXT **k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDo7**`<br>`@ IN\
          \ TXT **v=spf1 include:spf.unione.io ~all**`<br>- Первая запись представ\
          лена содержимым поля **verification-record**.<br>- Вторая запись должна\
          \ включать содержимое поля **dkim** сразу после **p=**. Обратите внимани\
          е на имя записи! Префикс **us._domainkey.** очень важен для того, чтобы\
          \ DKIM селектор UniOne отрабатывал правильно.<br>- Третья запись опциона\
          льна, но мы её очень рекомендуем добавлять, это SPF-запись, которая повы\
          шает доставляемость. Возможно, она уже у вас есть - в этом случае просто\
          \ добавьте include:spf.unione.io после v=spf1.<br>Требования к синтаксис\
          у записей у различных DNS-провайдеров могут отличаться:<br>- иногда треб\
          уется указывать полное имя домена с завершающей точкой, наподобие **example.com.**\
          \ вместо символа @.<br>- некоторые провайдеры требуют указание времени ж\
          изни (TTL, например 3600)<br>- для некоторых провайдеров будет излишним\
          \ помещения значений в двойные кавычки<br>Пожалуйста, проверьте требован\
          ия своего провайдера и подскажите это своим пользователям.<br>Для реализ\
          ации white-label решений, есть возможность изменить стандартные DNS-запи\
          си на те, что не включают в себя подстроки **unione**. Что бы узнать под\
          робнее - напишите в техподдержку."

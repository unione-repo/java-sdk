        delivery_status:
          description: "UniOne internal detailed delivery status. Some possible values\
            \ are:<br>__err_user_unknown__ -- email address doesn't exist;<br>__err_user_inactive__\
            \ -- email address isn't used anymore;<br>__err_will_retry__ -- email\
            \ was temporary rejected, delivery will be retried later;<br>__err_mailbox_discarded__\
            \ -- email address was active earlier, but now it's deleted;<br>__err_mailbox_full__\
            \ -- mailbox is full;<br>__err_spam_rejected__ -- email was rejected as\
            \ a spam;<br>__err_blacklisted__ -- email was rejected because sender\
            \ IP or sender domain is found in a black list;<br>__err_too_large__ --\
            \ email size is over limit, according to recipient's server;<br>__err_unsubscribed__\
            \ -- email was unsubscribed;<br>__err_unreachable__ -- numerous delivery\
            \ failures lead to mark this email address as permanently unavailable;<br>__err_skip_letter__\
            \ -- sending has been canceled because the email address is temporarily\
            \ unavailable;<br>__err_domain_inactive__ -- the domain does not accept\
            \ mail or does not exist;<br>__err_destination_misconfigured__ -- the\
            \ domain does not accept mail due to incorrect settings on the recipient’\
            s side, and the server’s response contains information about a cause that\
            \ can be fixed (for example, an inoperative blacklist is used, etc.);<br>__err_delivery_failed__\
            \ -- delivery failed due to other reasons;<br>__err_spam_skipped__ --\
            \ sending has been canceled because the campaign has been blocked as a\
            \ spam;<br>__err_lost__ -- the message was not sent due to inconsistency\
            \ of its parts or it has been lost because of the failure on our side.\
            \ The sender needs to re-send the letter on his own, since the original\
            \ has not been saved;<br>We reserve the right to change or add internal\
            \ delivery statuses as we need, so the following list is provided as an\
            \ example only, without any description: ok_sent, ok_delivered, ok_read,\
            \ ok_link_visited, ok_unsubscribed, ok_resubscribed, ok_spam_folder, ok_fbl,\
            \ not_sent, skip_dup_unreachable, skip_dup_temp_unreachable, skip_dup_mailbox_full,\
            \ err_spam_removed, err_resend, err_unknown, err_retry_letter, err_src_invalid,\
            \ err_dest_invalid, err_not_available, err_internal, err_no_dns, err_no_smtp,\
            \ err_giveup."
          type: string
          x-description-i18n:
            rus: "Внутренний детальный статус доставки UniOne. Вот некоторые из во\
              зможных статусов:<br>__err_user_unknown__ -- адрес не существует (и\
              \ неизвестно, существовал ли когда-либо);<br>__err_user_inactive__ --\
              \ адрес не используется;<br>__err_will_retry__ -- письмо было времен\
              но отклонено и позднее будет осуществлена повторная попытка доставки\
              ;<br>__err_mailbox_discarded__ -- адрес удален (т.е. когда-то сущест\
              вовал, но теперь его нет);<br>__err_mailbox_full__ -- почтовый ящик\
              \ переполнен;<br>__err_spam_rejected__ -- письмо отвергнуто как спам\
              ;<br>__err_blacklisted__ -- письмо было отклонено по причине наличия\
              \ IP-адреса или домена отправителя в каком-то из чёрных списков;<br>__err_too_large__\
              \ -- по мнению сервера получателя, письмо превышает допустимый разме\
              р;<br>__err_unsubscribed__ -- адресат ранее отписался от ваших рассы\
              лок;<br>__err_unreachable__ -- адрес помечен как постоянно недоступн\
              ый по причине многократных ошибок доставки на этот адрес;<br>__err_skip_letter__\
              \ -- отправка отменена, так как email адрес временно недоступен;<br>__err_domain_inactive__\
              \ -- домен не принимает почту или не существует;<br>__err_destination_misconfigured__\
              \ -- домен не принимает почту из-за неверной настройки на стороне по\

              имер, имя, товар для показа именно данному получателю - см. [Шаблони\
              заторы](https://docs.unione.io/en/template-engines)). Подстановки ра\
              ботают в параметрах:<br><br>* body.html* body.plaintext* body.amp* subject*\
              \ from_name* headers[**List-Unsubscribe**]* options.unsubscribe_url<br><br>Н\
              азвания переменных могут содержать буквы латинского алфавита, цифры\
              , символ **_**. Первым символом может быть только буква, использован\
              ие пробелов не допускается. Есть специальная переменная **to_name**,\
              \ позволяющая задать имя получателя. При подстановке туда **Имя Фами\
              лия** SMTP-заголовок “To” будет выглядеть как **Имя Фамилия <email@example.com>**.\
              \ Длина переменной **to_name** ограничена 78 символами."
        metadata:
          additionalProperties:
            type: string
          description: "Object for passing the metadata, such as **key**: **value**.\

          example: 2023-01-01 22:14:59
          format: utc-date-time
          type: string
          x-description-i18n:
            rus: Дата и время проверки адреса в формате ГГГГ-ММ-ДД чч:мм:сс в часовом
              поясе UTC.
      required:

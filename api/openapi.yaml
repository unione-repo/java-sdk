        cause:
          description: "Possible statuses:<br><br>* **no_mx_record** - no MX record\
            \ found for the target domain,* **syntax_error** - the address syntax\
            \ is invalid,* **possible_typo** - the address is likely to have a typo,*\
            \ **mailbox_not_found** - the address does not exist,* **global_suppression**\
            \ - the address has been marked as unreachable due to multiple previous\
            \ delivery errors,* **disposable** - this is a disposable one-time email\
            \ address which is usually valid for a few minutes only,* **role** - the\
            \ address is not likely to belong to an actual person, but rather to a\
            \ certain business staff role,* **abuse** - the address is known to be\
            \ a source of a large number of complaints, sometimes issued automatically,*\
            \ **spamtrap** - this email is a spam trap, it is published openly but\
            \ never used for actual emails. Sending messages to such addresses has\
            \ a huge negative impact on reputation score,* **smtp_connection_failed**\
            \ - the domain’s SMTP server does not respond; the address may contain\
            \ a typo."
          example: disposable
          type: string
          x-description-i18n:
            rus: "Возможные статусы:<br><br>* **no_mx_record** - у домена отсутств\
              уют MX записи,* **syntax_error** - адрес не соответствует стандартам\
              \ email,* **possible_typo** - возможно, адрес введен с ошибкой,* **mailbox_not_found**\
              \ - адрес не существует,* **global_suppression** - адрес перманентно\
              \ недоступен в сервисе из-за многократных недоставок,* **disposable**\
              \ - одноразовый email, обычно такие адреса принимают почту только не\
              сколько минут,* **role** - общий адрес электронной почты, чаще всего\
              \ используются группой людей и не принадлежит конкретному человеку,*\
              \ **abuse** - адреса с которых поступает большое количество жалоб и\
              \ нажатий на **спам**, иногда даже в автоматическом режиме,* **spamtrap**\
              \ - адреса спам-ловушки, обычно размещаются почтовыми провайдерами в\
              \ открытом доступе, но никогда не используются для подписки. Отправк\
              а писем на такие адреса сильно вредит репутации отправителя,* **smtp_connection_failed**\
              \ - SMTP-сервер недоступен - возможно, адрес введен с ошибкой."
        validity:
          description: "Validity score, from 0 to 100 (0 – invalid, 100 – valid)."
          example: 10
          type: integer
          x-description-i18n:
            rus: "Вероятность того, что адрес действительный. От 0 до 100 (100 - д\
              ействительный, 0 - недействительный)."
        local_part:
          description: Local part (everything preceding the @ sign).

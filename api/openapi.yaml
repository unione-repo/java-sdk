  /domain/get-dns-records.json:
    post:
      description: "In order to send emails you have to confirm that you own the domain\
        \ that you are going to send emails from and setup DKIM signature for the\
        \ domain. This method allows you to register your domain in UniOne and generate\
        \ verification record and DKIM key, or return previously generated ones if\
        \ domain is already registered.<br>You should add then DNS records like this\
        \ to all of the domains you want to confirm:<br>`@ IN TXT **unione-validate-hash=483bb362ebdbeedd755cfb1d4d661**`<br>`us._domainkey\
        \ IN TXT **k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDo7**`<br>`@ IN\
        \ TXT **v=spf1 include:spf.unione.io ~all**`<br>- First record value should\
        \ contain **verification-record** field returned by get-dns-records method\
        \ **as is**.<br>- Second record value should contain **dkim** field value\
        \ after **p=**. Mind the name of this record! **us._domainkey.** prefix is\
        \ important for DKIM selector of UniOne to work properly.<br>- Third record\
        \ contains optional, but very recommended SPF entry. Probably you already\
        \ have one, then just add append include:spf.unione.io right after v=spf1.<br>Syntax\
        \ requirements of different DNS providers may differ:<br>- sometimes it's\
        \ necesarry to put full domain name instead of @ sign.<br>- some providers\
        \ require add TTL value (like 3600)<br>- some providers don't require quotes\
        \ for enclosing values<br>Please check requirements of your provider and advice\
        \ your users to do it."
      operationId: domain-get-dns-records
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/domain_get_dns_records_request"

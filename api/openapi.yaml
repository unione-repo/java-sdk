            \ 1024 symbols. The metadata is returned by [webhook](https://docs.unione.io/en/web-api-ref#webhook)\
            \ and [event-dump](https://docs.unione.io/en/web-api-ref#event-dump) methods.\
            \ If you pass strign up to 128 bit with **campaign_id** field name (name\
            \ is configurable thru support), it will be considered as campaign identifier\
            \ in statistics."
          example:
            campaign_id: c77f4f4e-3561-49f7-9f07-c35be01b4f43
            customer_hash: b253ac7
          type: object
          x-description-i18n:
            rus: "Объект для передачи метаданных, специфичных для отдельного получ\
              ателя, где **key** - строка до 64 символов длиной, **value** - строк\
              а до 1024 символов длиной, максимальное количество ключей - 10. Мета\
              данные передаются при вызове [вебхуков](https://docs.unione.io/en/web-api-ref#webhook)\
              \ и методов [event-dump](https://docs.unione.io/en/web-api-ref#event-dump).\
              \ Для группировки писем в одну рассылку может использоваться системн\
              ый ключ **campaign_id** со значением в виде неотрицательного десятич\
              ного целого или UUID до 128 бит."

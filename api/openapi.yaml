          type: string
          x-description-i18n:
            rus: "Локальная часть email адреса (все, что перед знаком **@**)."
        domain:
          description: Domain name part.
          example: example.com
          type: string
          x-description-i18n:
            rus: Доменная часть email адреса.
        mx_found:
          description: "True if the address’ domain does have an MX record, false\

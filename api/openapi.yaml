          example: true
          type: boolean
          x-description-i18n:
            rus: "Есть ли у домена MX запись? true если есть, false если отсутству\
              ет."
        mx_record:
          description: Preferred MX record for the domain.
          example: "10"
          type: string
          x-description-i18n:
            rus: Предпочтительная MX-запись домена.
        did_you_mean:
          description: "For addresses which are likely to have typing errors (cause=possible_typo),\

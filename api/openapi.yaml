openapi: 3.0.0
info:
  contact:
    url: https://cp.unione.io/en/support
    x-url-i18n:
      rus: https://cp.unione.io/ru/support
  description: "All UniOne API methods require HTTPS connection. UniOne accepts HTTP\
    \ POST requests in JSON format up to 10 megabytes long and returns HTTP response\
    \ also in JSON. API endpoint (or base URL) depends on which datacenter the user\
    \ is registered at.<br>The preferred way is to use https://api.unione.io/en/transactional/api/v1\
    \ endpoint, but also you can use https://eu1.unione.io/en/transactional/api/v1\
    \ or https://us1.unione.io/en/transactional/api/v1 directly, depending on the\
    \ host your account was registered at."
  termsOfService: https://unione.io/terms.html
  title: Web API
  version: "1.76"
  x-description-i18n:
    rus: "Все методы UniOne API принимают только HTTPS POST-запросы в формате JSON\
      \ размером максимум 10 мегабайт и возвращают ответ тоже в JSON. Все запросы\
      \ отправляются на адрес, зависящий от дата-центра регистрации пользователя.<br>П\
      редпочтительный способ — использовать endpoint https://api.unione.io/ru/transactional/api/v1,\
      \ но также можно напрямую использовать https://eu1.unione.io/ru/transactional/api/v1\
      \ или https://us1.unione.io/ru/transactional/api/v1, в зависимости от того,\
      \ в каком датацентре зарегистрирован ваш аккаунт."
  x-termsOfService-i18n:
    rus: https://unione.io/terms.html
externalDocs:
  description: Additional technical documentation for web api
  url: https://docs.unione.io/en/web-api-ref
servers:
- description: UniOne API-server instance
  url: https://api.unione.io/en/transactional/api/v1
  x-description-i18n:
    rus: API-сервер UniOne
  x-url-i18n:
    rus: https://api.unione.io/ru/transactional/api/v1
security:
- apiKeyAuth: []
tags:
- description: This group of methods is related with email sending.
  name: Email
  x-description-i18n:
    rus: Эта группа методов связана с отправкой email.
- description: "Email validation methods. As a result of the check, you’ll get detailed\
    \ information on email validity. It will help eliminate nonexistent emails, decrease\
    \ the number of complaints, clean up the subscribers list and eventually enhance\
    \ your sender reputation score. For example, you may add validation to a subscription\
    \ form on your site to let users know they’ve just entered an invalid address."
  name: Email-validation
  x-description-i18n:
    rus: "Методы проверки email адресов. Проверка адреса электронной почты предост\
      авляет подробную информацию о работоспособности email. Это позволит исключит\
      ь из отправки несуществующие email, снизить показатель жалоб, очистить списо\
      к подписчиков и в конечном итоге улучшить вашу репутацию как отправителя. На\
      пример, вы можете интегрировать процесс проверки в форму регистрации вашего\
      \ сайта и уже на этапе ввода адреса сообщать пользователям, что адрес, котор\
      ый они ввели в форму, недействителен."
- description: "You have the option of storing a template on the UniOne side and then\
    \ using it by id, which is highly recommended for sending repetitive messages\
    \ or high volume traffic. UniOne supports two different [template engines](https://docs.unione.io/en/template-engines)."
  name: Template
  x-description-i18n:
    rus: "Вы можете сохранить шаблон на стороне UniOne и затем ссылаться на него п\
      о идентификатору. Это не является обязательным, но крайне рекомендуется в сл\
      учае повторяющихся email-сообщений или при больших объёмах отправки. UniOne\
      \ поддерживает два разных синтаксиса для шаблонов, подробнее читайте [здесь\
      ](https://docs.unione.io/en/template-engines)."
- description: "UniOne lets you recieve notifications about email status changes or\
    \ spam blocks. You provide an URL and every time a watched event occurs we will\
    \ notify you by submitting a request with JSON data to this URL.<br>You can configure\
    \ the format of webhook calls (JSON or gzipped JSON), which events you want to\
    \ be notified of, whether or not you let us groups several events in one request,\
    \ do you want to receive extra details like SMTP answer or recipient's user agent,\
    \ etc.<br>Please note that your webhook handler should be able to process at least\
    \ 5 parallel requests, up to 100 events each (but you can configure the maximum\
    \ number of parallel connections up to 100, which is recommended).<br>If the URL\
    \ of your webhook handler is not available (the response is not HTTP 200 OK within\
    \ 3 seconds timeout), the system will repeat requests each 10 minutes during 24\
    \ hours, passing extra parameter retry_count. If there were at least 10 events\
    \ during last 24 hours and all the webhook requests about these events have failed\
    \ then we consider webhook handler broken and change it's status to inactive automatically.\
    \ A notification about that is sent to an email [configured in control panel](https://cp.unione.io/en/user/alerting/technical/).<br>The\
    \ format of webhook request and details of each event are described [here](https://docs.unione.io/en/web-api-ref#callback-format)."
  name: Webhook
  x-description-i18n:
    rus: "UniOne позволяет вам получать уведомления об изменении статуса доставки\
      \ письма или спам-блокировках. Вы предоставляете URL и в случае возникновени\
      я интересующего вас события мы уведомляем вас путём передачи на этот URL JSON-д\
      анных о событии.<br>Вы можете настроить формат вызова вебхуков (просто JSON\
      \ или JSON, запакованный в gzip), какие именно события вас интересуют, разре\
      шено ли группировать несколько событий в одном вызове, нужны ли вам такие по\
      дробности, как SMTP-ответ сервера или user agent получателя и т.п.<br>Обрати\
      те внимание, что ваш обработчик должен уметь принимать как минимум 5 паралле\
      льных вызовов, до 100 событий в каждом (но вы можете настроить максимально р\
      азрешённое количество параллельных вызовов, увеличив их до 100).<br>Если URL,\
      \ на который отправляется webhook, недоступен (нет ответа HTTP 200 OK в тече\
      ние 3 секунд), попытки отправки webhook на этот URL до получения ожидаемого\
      \ 200 ОК будут продолжаться в течение 24 часов с интервалом в 10 минут с доп\
      олнительным параметром retry_count, значение которого будет увеличиваться на\
      \ 1 с каждой повторной отправкой webhook. Если в течение 24 часов произошло\
      \ как минимум 10 событий и ни один из многократных вызовов вебхуков об этих\
      \ событиях не был удачным, то мы считаем обработчик неработоспособным и авто\
      матически устанавливаем его статус в неактивный и сообщаем об этом на email,\
      \ [указанный в личном кабинете](https://cp.unione.io/ru/user/alerting/technical/).<br>Ф\
      ормат вебхуков и структура каждого события описаны [здесь](https://docs.unione.io/en/web-api-ref#callback-format)."
- description: "Methods for managing suppression lists. An email can be added to suppression\
    \ list because of unsubscription, bounce or complain."
  name: Suppression
  x-description-i18n:
    rus: "Методы для управления адресами, отправка на которые заблокирована по раз\
      ным причинам - отписка, недоступность, жалобы."
- description: "You can use these methods to setup sender domains and check their\
    \ statuses. They might be useful in case you want to automate adding domains for\
    \ your own clients.<br>To add new sender domain thru API you should take following\
    \ steps:<br>- Get DNS records with [domain/get-dns-records](https://docs.unione.io/en/web-api-ref#domain-get-dns-records)\
    \ method and add them to your DNS provider.<br>- Every 5-10 minutes call [domain/list](https://docs.unione.io/en/web-api-ref#domain-list)\
    \ method for your domain (or several domains) and check verification-record.status\
    \ and dkim.status in the response. You can call it more often if you like, but\
    \ please not more than once per minute.<br>- If verification-record.status=**unconfirmed**\
    \ then you should call [domain/validate-verification-record](https://docs.unione.io/en/web-api-ref#domain-validate-verification-record)\
    \ to trigger verification record validation.<br>- If dkim.status=**inactive**\
    \ then start DKIM checking by calling [domain/validate-dkim](https://docs.unione.io/en/web-api-ref#domain-validate-dkim)\
    \ (UniOne itself checks DKIM every 30 minutes also)<br>- When you get verification-record.status=**confirmed**\
    \ and dkim.status=**active** for the domain then you can stop checking it's status\
    \ with domain/list and start using it as a sender domain."
  name: Domain
  x-description-i18n:
    rus: "Методы для настройки доменов отправки и проверки их статусов. Полезны, е\
      сли вам недостаточно добавления доменов через веб-интерфейс UniOne, и, напри\
      мер, хочется автоматизировать добавление доменов для ваших собственных клиен\
      тов.<br>Для добавления нового домена отправки через API вы должны сделать сл\
      едующее:<br>- Подтвердите домен, с которого будут отправляться письма, внеся\
      \ необходимые DNS записи, получив их с помощью метода [domain/get-dns-records](https://docs.unione.io/en/web-api-ref#domain-get-dns-records).<br>-\
      \ После добавления раз в 5-10 минут вызывайте [domain/list](https://docs.unione.io/en/web-api-ref#domain-list)\
      \ с указанием добавленного домена (или нескольких доменов сразу, если провер\
      ить надо несколько) и проверяйте verification-record.status и dkim.status в\
      \ ответе domain/list. Можно делать запрос и чаще - но точно не чаще раза в м\
      инуту.<br>- Если verification-record.status=**unconfirmed**, то инициируйте\
      \ проверку правильности записи владения доменом с помощью вызова [domain/validate-verification-record](https://docs.unione.io/en/web-api-ref#domain-validate-verification-record).<br>-\
      \ Если dkim.status=**inactive**, то инициируйте проверку правильности DKIM-з\
      аписи с помощью вызова [domain/validate-dkim](https://docs.unione.io/en/web-api-ref#domain-validate-dkim)\
      \ (впрочем, DKIM-записи UniOne и сам проверяет раз в полчаса)<br>- И только\
      \ когда domain/list возвратил verification-record.status=**confirmed** и dkim.status=**active**\
      \ для домена, можно использовать домен для отправки и прекратить его ожидани\
      е и вызовы для него вышеуказанных методов."
- description: "These methods are used to obtain a list of events for a given period\
    \ of time. The data is stored for up to 45 days, depending on your tariff, i.\
    \ e. you may fetch all event data starting from 00:00:00 31 days ago and up to\
    \ current time. For custom tarifs with big sending volumes event dumps are available\
    \ only for the last 7 days."
  name: Event-dump
  x-description-i18n:
    rus: "Методы для получения списка произошедших событий за определенный период\
      . Данные хранятся до 45 дней, в зависимости от вашего тарифа. Это значит, чт\
      о можно запросить события начиная с 00:00:00 45 дня назад и до текущего моме\
      нта времени. Для индивидуальных тарифов с большими объёмами по умолчанию соб\
      ытия доступны только за последние 7 дней."
- description: "This family of methods is used to manage user-defined tags. Tags are\
    \ used to categorize letters based on your own criteria, e. g. to create a distinction\
    \ between marketing and transactional letters or group together all notifications\
    \ for a particular order type. UniOne allows you to assign tags to all outgoing\
    \ emails, and the tags you’ve set may then be used to filter and analyze delivery\
    \ statistics."
  name: Tag
  x-description-i18n:
    rus: "Методы управления пользовательскими метками. С помощью меток вы можете к\
      лассифицировать письма по необходимым критериям. Отделить маркетинговые пись\
      ма от транзакционных, или письма с подтверждением регистрации от уведомлений\
      \ о заказе. UniOne позволяет помечать метками каждое исходящее сообщение, а\
      \ после сегментировать и анализировать статистику на основании указанных при\
      \ отправке меток."
- description: "Projects allow you to group several independent domains, webhooks,\
    \ templates, and unsubscription lists together. It's very useful if you have your\
    \ own clients and manage their data from a single UniOne account. Each project\
    \ receives its own API key, and all API calls with that API key only deal with\
    \ the data of that project. This way, you can assign a separate project for each\
    \ client and be sure that they won't conflict; e.g. unsubscribing from one project\
    \ won't affect another.<br>Projects methods are disabled by default due to antispam\
    \ measures. To enable them, [contact support](https://cp.unione.io/en/support).<br>Please\
    \ note that sending domains are confirmed and used on per-project basis by default.\
    \ But it's possible to allow projects to send emails from domains confirmed for\
    \ main account - just [ask support](https://cp.unione.io/en/support) to enable\
    \ it."
  name: Project
  x-description-i18n:
    rus: "Проекты позволяют объединить несколько независимых доменов с веб-хуками\
      , шаблонами и списками отписки. Это очень полезно, если у вас есть свои клие\
      нты и вы управляете их данными из одной учетной записи UniOne. Каждый проект\
      \ получает свой собственный ключ API, а вызовы API методов с этим ключом обр\
      абатывают только данные этого проекта. Таким образом, вы можете назначить от\
      дельный проект для каждого пользователя и быть уверенным, что они не будут к\
      онфликтовать: например, отмена подписки на один проект не повлияет на другой\
      .<br>Методы проектов по умолчанию отключены из-за мер по защите от спама. Чт\
      обы их включить, вам необходимо обратиться в [службу поддержки](https://cp.unione.io/ru/support).<br>О\
      братите внимание: по умолчанию домены для отправки подтверждаются и использу\
      ются независимо для основного аккаунта и каждого из проектов. Но есть возмож\
      ность включить для проектов использование доменов, подтвержденных в основном\
      \ аккаунте. Просто попросите об этом [техподдержку](https://cp.unione.io/ru/support)."
- description: System operations.
  name: System
  x-description-i18n:
    rus: Системные методы.
- description: "Obsolete methods dealing with unsubscribes. We recommend using the\
    \ more flexible [suppression](https://docs.unione.io/en/web-api-ref#suppression)\
    \ methods instead. Note that you can't resubscribe an unsubscribed recipient using\
    \ WebAPI, but you can send him an email with subscription link using email/subscribe\
    \ method."
  name: Obsolete
  x-description-i18n:
    rus: "Устаревшие методы работы с отписками. Мы рекомендуем пользоваться вместо\
      \ них более гибкими методами [suppression](https://docs.unione.io/en/web-api-ref#suppression).\
      \ Обратите внимание, что снова подписать отписанного адресата через WebAPI н\
      ельзя. Можно только выслать ему email со ссылкой повторной подписки с помощь\
      ю метода email/subscribe."
paths:
  /email/send.json:
    post:
      description: "While sending you can provide substitutions (merge tags), use\
        \ a template, turn on read or click tracking, etc.<br>Restrictions:<br>* maximum\
        \ request size is 10 MB<br>* maximum number of recipients is 500<br>* The\
        \ symbol '/' is not allowed in attachment names<br>If the list of recipients\
        \ contains invalid, non-existent, duplicate, or unsubscribed emails, those\
        \ emails will be returned in the output parameter failed_emails, and the email\
        \ will be sent to all other valid emails addresses. If all the emails addresses\
        \ fall into failed_emails, sending will not be carried out and API error 204\
        \ will be returned."
      operationId: email-send
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/email_send_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/email_send_200_response"
          description: Email successfully accepted for sending.
          x-description-i18n:
            rus: Email успешно принят к отправке.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error occured.
          x-description-i18n:
            rus: Произошла ошибка.
      summary: Sends an email or a bunch of emails
      tags:
      - Email
      x-render-on-readme: true
      x-summary-i18n:
        rus: Метод для отправки писем вашим подписчикам.
      x-description-i18n:
        rus: "При отправке вы можете использовать подстановки переменных, шаблоны\
          , включить отслеживание прочтений или переходов по ссылкам и многое друг\
          ое.<br>Ограничения:<br>* максимальный размер запроса - 10 MB<br>* максим\
          альное количество получателей (recipients) – 500 email<br>* В названии в\
          ложений запрещен символ '/'<br>Если при отправке письма в списке получат\
          елей будут некорректно введенные, несуществующие, повторяющиеся, или отп\
          исанные адреса, они будут возвращены в ответе с помощью параметра failed_emails,\
          \ письмо же будет отправлено на все остальные приемлемые адреса. Если вс\
          е адреса попадут в failed_emails, отправка осуществлена не будет, будет\
          \ возвращена ошибка c API-кодом 204."
      x-content-type: application/json
      x-accepts:
      - application/json
  /email/subscribe.json:
    post:
      description: "This method allows subscription renewal by a former subscriber\
        \ who has previously unsubscribed, or who is blocked because of complaints.\
        \ This method sends an email with a new subscription link to a former subscriber.\
        \ Once the recipient clicks the link, their subscription status is restored.<br>There\
        \ is a default restriction that limits this method to being used once a day.\
        \ If you need to resubscribe more often, please ask support about it."
      operationId: email-subscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/email_subscribe_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
          description: Email successfully accepted for sending.
          x-description-i18n:
            rus: Email успешно принят к отправке.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error occured.
          x-description-i18n:
            rus: Произошла ошибка.
      summary: Sends an email with (re)subscribe link.
      tags:
      - Email
      x-summary-i18n:
        rus: Отправить ссылку на (пере)подписку.
      x-description-i18n:
        rus: "Метод позволяет переподписать бывшего подписчика, который отписался\
          \ ранее, был заблокирован из-за жалоб или чей адрес недоступен по какой\
          -либо иной причине.<br>При вызове отправляется письмо в нейтральном диза\
          йне с ссылкой подписки. При переходе по ссылке из email подписчик перест\
          ает быть недоступным для пользователя и/или перестает быть глобально отп\
          исанным.<br>По умолчанию разрешена только одна отправка письма переподпи\
          ски в сутки. Если вам нужно больше - напишите в техподдержку."
      x-content-type: application/json
      x-accepts:
      - application/json
  /template/set.json:
    post:
      description: Restrictions:<br>* The maximum request size is 10 MB.<br>* The
        number of templates is limited to 10000.
      operationId: template-set
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/template_set_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/template_set_200_response"
          description: Template set successfully.
          x-description-i18n:
            rus: Шаблон успешно задан.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error occured.
          x-description-i18n:
            rus: Произошла ошибка.
      summary: Creates or updates an email template.
      tags:
      - Template
      x-summary-i18n:
        rus: Создать или обновить шаблон.
      x-description-i18n:
        rus: Ограничения:<br>* Максимальный размер запроса - 10 MB.<br>* Количество
          шаблонов ограничено 10000.
      x-content-type: application/json
      x-accepts:
      - application/json
  /template/get.json:
    post:
      operationId: template-get
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/template_get_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/template_set_200_response"
          description: Template returned successfully.
          x-description-i18n:
            rus: Шаблон успешно возвращён.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error occured.
          x-description-i18n:
            rus: Произошла ошибка.
      summary: Gets template properties by it's id.
      tags:
      - Template
      x-summary-i18n:
        rus: Возвращает свойства шаблона по его идентификатору.
      x-content-type: application/json
      x-accepts:
      - application/json
  /template/list.json:
    post:
      description: You can iterate thru large list using **offset** and **limit**
        parameters. When less than **limit** templates are returned then the end of
        list is reached.
      operationId: template-list
      requestBody:
        content:
          application/json:
            schema:
